<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img"><title>Etapas da previsão temporal</title><rect width="960" height="280" fill="white"/><text x="25" y="40" font-family="Arial" font-size="24" font-weight="bold" fill="#18324b">Previsão temporal sem dados futuros na entrada</text><text x="25" y="65" font-family="Arial" font-size="14" fill="#53677b">Esquema conceitual; o alvo futuro é usado apenas para avaliar erros depois</text><rect x="25" y="110" width="208" height="90" rx="12" fill="#e3f3ef" stroke="#c1d5db"/><text x="129" y="149" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#18324b">Histórico conhecido</text><text x="129" y="174" text-anchor="middle" font-family="Arial" font-size="13" fill="#53677b">Até o instante t</text><path d="M237 154 l18 0 l-7 -6 m7 6 l-7 6" stroke="#16818b" fill="none" stroke-width="3"/><rect x="262" y="110" width="208" height="90" rx="12" fill="#eaf3fa" stroke="#c1d5db"/><text x="366" y="149" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#18324b">Janela de entrada</text><text x="366" y="174" text-anchor="middle" font-family="Arial" font-size="13" fill="#53677b">6 a 48 candles</text><path d="M474 154 l18 0 l-7 -6 m7 6 l-7 6" stroke="#16818b" fill="none" stroke-width="3"/><rect x="499" y="110" width="208" height="90" rx="12" fill="#e3f3ef" stroke="#c1d5db"/><text x="603" y="149" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#18324b">Modelo treinado</text><text x="603" y="174" text-anchor="middle" font-family="Arial" font-size="13" fill="#53677b">Somente dados passados</text><path d="M711 154 l18 0 l-7 -6 m7 6 l-7 6" stroke="#16818b" fill="none" stroke-width="3"/><rect x="736" y="110" width="208" height="90" rx="12" fill="#eaf3fa" stroke="#c1d5db"/><text x="840" y="149" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="16" fill="#18324b">Previsão RV60</text><text x="840" y="174" text-anchor="middle" font-family="Arial" font-size="13" fill="#53677b">Próximos 60 minutos</text><text x="480" y="245" text-anchor="middle" font-family="Arial" font-size="14" fill="#53677b">O comportamento observado nos 60 minutos futuros não compõe os atributos usados para prever.</text></svg>